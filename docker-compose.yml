services:

  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.0
    container_name: scraper_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - scraper_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: scraper_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - scraper_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Gateway ───────────────────────────────────────────────────
  gateway:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: scraper_gateway
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      SPRING_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    command:
      - --spring.rabbitmq.host=rabbitmq
      - --spring.rabbitmq.port=5672
      - --spring.rabbitmq.username=${RABBITMQ_USER}
      - --spring.rabbitmq.password=${RABBITMQ_PASSWORD}
      - --spring.data.mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      - --spring.mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - scraper_net

  # ─── Worker Facebook ───────────────────────────────────────────────────────
  # Reste sur le reseau bridge "scraper_net" (isole): il ne parle pas au proxy
  # IPv6 local, donc pas besoin d'acceder au reseau de l'hote.
  worker-facebook:
    build:
      context: "./platform/facebook scraper"
      dockerfile: Dockerfile
    container_name: scraper_worker_facebook
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: scraping_queue_facebook
      RABBITMQ_RESULT_QUEUE: scrape_result_queue
      RABBITMQ_EXCHANGE: scrape.exchange
    volumes:
      # fb_cookies.json contient la session Facebook (exportee au prealable via
      # save_session.py); on la monte plutot que de la copier dans l'image
      # pour ne jamais committer/embarquer un secret dans un layer Docker.
      - "./platform/facebook scraper/fb_cookies.json:/app/fb_cookies.json:ro"
      - "./logs:/app/logs"
    command: ["python", "worker.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - scraper_net

  # ─── Worker TikTok ─────────────────────────────────────────────────────────
  # Reste desormais sur le reseau bridge "scraper_net" comme les autres
  # services: la rotation d'IP se fait via TIKTOK_PROXY_LIST (proxies
  # Webshare externes, joignables depuis n'importe quel reseau Docker), donc
  # on n'a plus besoin de network_mode: "host" pour atteindre un proxy local
  # sur 127.0.0.1 (l'ancienne rotation IPv6, desactivee par defaut - voir .env).
  # Si vous reactivez un jour tools/ipv6_rotating_proxy.py sur l'hote, remettez
  # `network_mode: "host"` (et RABBITMQ_HOST: 127.0.0.1) a la place de
  # "networks"/"RABBITMQ_HOST: rabbitmq" ci-dessous.
  worker-tiktok:
    build:
      context: .
      dockerfile: "platform/tiktok scraper/Dockerfile"
    container_name: scraper_worker_tiktok
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: scraping_queue_tiktok
      RABBITMQ_RESULT_QUEUE: scrape_result_queue
      RABBITMQ_EXCHANGE: scrape.exchange
      # Override du chemin defini dans .env (qui est relatif a la racine du
      # repo pour les runs locaux hors Docker): dans le conteneur, le CWD est
      # deja "platform/tiktok scraper", donc un chemin relatif simple suffit.
      VIDEO_ANALYSIS_OUTPUT_DIR: video_reports
    volumes:
      # Le dossier est copie sans espace dans l'image ("tiktok-scraper", voir
      # Dockerfile), d'ou le chemin different a droite du ":".
      - "./platform/tiktok scraper/tiktok_profile:/app/platform/tiktok-scraper/tiktok_profile"
      - "./platform/tiktok scraper/video_reports:/app/platform/tiktok-scraper/video_reports"
      - "./logs:/app/logs"
    command: ["python", "worker.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - scraper_net

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
  rabbitmq_data:

# ─── Network ───────────────────────────────────────────────────────────────
networks:
  scraper_net:
    driver: bridge
