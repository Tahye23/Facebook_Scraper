services:

  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.0
    container_name: scraper_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - scraper_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: scraper_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - scraper_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Gateway ───────────────────────────────────────────────────
  gateway:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: scraper_gateway
    restart: unless-stopped
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      SPRING_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    command:
      - --spring.rabbitmq.host=rabbitmq
      - --spring.rabbitmq.port=5672
      - --spring.rabbitmq.username=${RABBITMQ_USER}
      - --spring.rabbitmq.password=${RABBITMQ_PASSWORD}
      - --spring.data.mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      - --spring.mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - scraper_net

  # ─── Worker Facebook ───────────────────────────────────────────────────────
  # Reste sur le reseau bridge "scraper_net" (isole): il ne parle pas au proxy
  # IPv6 local, donc pas besoin d'acceder au reseau de l'hote.
  worker-facebook:
    build:
      context: "./platform/facebook scraper"
      dockerfile: Dockerfile
    container_name: scraper_worker_facebook
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: scraping_queue_facebook
      RABBITMQ_RESULT_QUEUE: scrape_result_queue
      RABBITMQ_EXCHANGE: scrape.exchange
    volumes:
      # fb_cookies.json contient la session Facebook (exportee au prealable via
      # save_session.py); on la monte plutot que de la copier dans l'image
      # pour ne jamais committer/embarquer un secret dans un layer Docker.
      - "./platform/facebook scraper/fb_cookies.json:/app/fb_cookies.json:ro"
      - "./logs:/app/logs"
    command: ["python", "worker.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - scraper_net

  # ─── Worker TikTok ─────────────────────────────────────────────────────────
  # TRES IMPORTANT: network_mode "host" (pas de "networks:" ni de "ports:" avec
  # ce mode). Ce worker doit pouvoir joindre le proxy SOCKS5 de rotation IPv6
  # (tools/ipv6_rotating_proxy.py) qui tourne EN SYSTEMD DIRECTEMENT SUR L'HOTE
  # du VPS, sur 127.0.0.1:1080 (proxy) et 127.0.0.1:8091 (controle /rotate).
  # Avec le reseau bridge par defaut, 127.0.0.1 a l'interieur du conteneur ne
  # designerait PAS l'hote mais le conteneur lui-meme: le proxy serait injoignable.
  # Consequence: comme ce conteneur partage la pile reseau de l'hote, il ne
  # peut PAS resoudre "rabbitmq" par DNS (ce nom n'existe que sur scraper_net);
  # il faut donc utiliser 127.0.0.1 (le port 5672 est publie sur l'hote par le
  # service rabbitmq ci-dessus).
  worker-tiktok:
    build:
      context: .
      dockerfile: "platform/tiktok scraper/Dockerfile"
    container_name: scraper_worker_tiktok
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: scraping_queue_tiktok
      RABBITMQ_RESULT_QUEUE: scrape_result_queue
      RABBITMQ_EXCHANGE: scrape.exchange
      # Override du chemin defini dans .env (qui est relatif a la racine du
      # repo pour les runs locaux hors Docker): dans le conteneur, le CWD est
      # deja "platform/tiktok scraper", donc un chemin relatif simple suffit.
      VIDEO_ANALYSIS_OUTPUT_DIR: video_reports
    volumes:
      # Le dossier est copie sans espace dans l'image ("tiktok-scraper", voir
      # Dockerfile), d'ou le chemin different a droite du ":".
      - "./platform/tiktok scraper/tiktok_profile:/app/platform/tiktok-scraper/tiktok_profile"
      - "./platform/tiktok scraper/video_reports:/app/platform/tiktok-scraper/video_reports"
      - "./logs:/app/logs"
    command: ["python", "worker.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
  rabbitmq_data:

# ─── Network ───────────────────────────────────────────────────────────────
networks:
  scraper_net:
    driver: bridge
